<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; connect-src 'self' https://github.com;">
  <title>睡眠分期分析系统 v1.1.0</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航 -->
    <header class="app-header">
      <h1>睡眠分期分析系统</h1>
      <p class="subtitle">脑电数据处理与模型训练平台</p>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 左侧：操作面板 -->
      <aside class="sidebar">
        <!-- 步骤1：数据上传 -->
        <section class="panel">
          <h2>1. 训练数据</h2>
          <div class="form-group">
            <label>训练数据目录</label>
            <div class="input-group">
              <input type="text" id="trainDataPath" placeholder="选择训练数据目录..." readonly>
              <button id="selectTrainBtn" class="btn btn-primary">选择</button>
            </div>
            <div id="trainDataInfo" class="data-info"></div>
          </div>
          <button id="runPreprocessBtn" class="btn btn-secondary btn-block" disabled>
            开始预处理
          </button>
          <div id="preprocessStatus" class="status-indicator"></div>
        </section>

        <!-- 步骤2：模型训练 -->
        <section class="panel">
          <h2>2. 模型训练</h2>
          <button id="runTrainingBtn" class="btn btn-secondary btn-block" disabled>
            开始训练
          </button>
          <div id="trainingStatus" class="status-indicator"></div>
          <div id="modelInfo" class="model-info"></div>
        </section>

        <!-- 步骤3：模型预测 -->
        <section class="panel">
          <h2>3. 模型预测</h2>
          <div class="form-group">
            <label>测试数据目录</label>
            <div class="input-group">
              <input type="text" id="testDataPath" placeholder="选择测试数据目录..." readonly>
              <button id="selectTestBtn" class="btn btn-primary">选择</button>
            </div>
          </div>
          <button id="runTestingBtn" class="btn btn-secondary btn-block" disabled>
            开始预测
          </button>
          <div id="testingStatus" class="status-indicator"></div>
        </section>

        <!-- 操作按钮 -->
        <section class="panel">
          <button id="stopBtn" class="btn btn-danger btn-block" disabled>
            停止当前操作
          </button>
        </section>
      </aside>

      <!-- 右侧：可视化与日志 -->
      <div class="content-area">
        <!-- 标签页 -->
        <div class="tabs">
          <button class="tab active" data-tab="waveform">波形图</button>
          <button class="tab" data-tab="log">运行日志</button>
          <button class="tab" data-tab="results">预测结果</button>
        </div>

        <!-- 波形图标签页 -->
        <div id="waveform-tab" class="tab-content active">
          <div class="waveform-controls">
            <label>选择脑电文件：</label>
            <select id="eegFileSelect" class="select-input">
              <option value="">-- 请先选择训练数据 --</option>
            </select>
            <button id="loadWaveBtn" class="btn btn-primary" disabled>加载波形</button>
            <button id="randomWaveBtn" class="btn btn-secondary" disabled>随机选择</button>
          </div>
          <div class="chart-container">
            <canvas id="waveformChart"></canvas>
          </div>
          <div id="waveformInfo" class="waveform-info"></div>
        </div>

        <!-- 日志标签页 -->
        <div id="log-tab" class="tab-content">
          <div class="log-controls">
            <button id="clearLogBtn" class="btn btn-secondary">清空日志</button>
            <button id="exportLogBtn" class="btn btn-secondary">导出日志</button>
          </div>
          <div id="logContainer" class="log-container">
            <div class="log-welcome">
              <p>欢迎使用睡眠分期分析系统</p>
              <p>请按照左侧步骤操作：</p>
              <ol>
                <li>选择训练数据目录</li>
                <li>点击"开始预处理"</li>
                <li>点击"开始训练"</li>
                <li>选择测试数据并进行预测</li>
              </ol>
            </div>
          </div>
        </div>

        <!-- 结果标签页 -->
        <div id="results-tab" class="tab-content">
          <div id="resultsContainer" class="results-container">
            <div class="no-results">
              <p>暂无预测结果</p>
              <p>请先完成模型训练后进行预测</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 底部状态栏 -->
    <footer class="app-footer">
      <div class="status-bar">
        <span id="statusText">就绪</span>
        <div class="footer-right">
          <a href="https://github.com/quarkes1/BMEcontestSEU" target="_blank" class="github-link">
            <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            GitHub
          </a>
          <span id="versionText">v1.1.0</span>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
